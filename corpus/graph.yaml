    description: the analytics vendor contract is unsigned
    severity: medium
  r_capacity:
    description: hosting capacity limits during peak load
    severity: medium
  r_auth_migration:
    description: authentication migration has no rollback plan
    severity: high
  r_qa_backlog:
    description: regression backlog in the QA team
    severity: low
  r_budget_overrun:
    description: forecast overrun against remaining budget
    severity: high
  r_fulfilment_gap:
    description: fulfilment integration lacks an owner
    severity: medium

